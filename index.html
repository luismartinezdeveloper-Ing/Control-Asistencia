      (function() {
        try {
          var nativeFetch = window.fetch;
          var _currentFetch = function() {
            return nativeFetch.apply(window, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              var _protoFetch = function() {
                return protoFetch.apply(window, arguments);
              };
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _protoFetch;
                },
                set: function(fn) {
                  _protoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
